# Executes an actual offscreen render; only unavailable devices/layers may be non validated.
# The final job name exposes that state rather than silently skipping a graphics proof.
name: GPU validation
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      backend:
        type: string
        required: true
      required:
        type: boolean
        required: true
permissions:
  contents: read
  checks: write
jobs:
  probe:
    permissions: {contents: read}
    name: Render and validate ${{ inputs.backend }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 10
    outputs:
      validation: ${{ steps.capture.outputs.validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpu-binary-${{ runner.os }}
          path: .cache/gpu-bin
      - name: Lavapipe and Khronos validation layers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb
          mkdir -p .cache/gpu-validation
          dpkg-query -W mesa-vulkan-drivers vulkan-validationlayers vulkan-tools > .cache/gpu-validation/runner.txt
          python - <<'PY'
          import os
          from pathlib import Path
          matches = list(Path('/usr/share/vulkan/icd.d').glob('lvp_icd*.json'))
          if len(matches) != 1:
              raise SystemExit('Expected exactly one lavapipe ICD')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('VK_DRIVER_FILES=' + str(matches[0]) + '\n')
              stream.write('VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation\n')
              stream.write('VK_KHRONOS_VALIDATION_VALIDATE_SYNC=1\n')
              stream.write('VK_LOADER_DEBUG=layer\n')
          PY
      - name: D3D12 adapter and validation inventory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/gpu-validation | Out-Null
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion | Out-File .cache/gpu-validation/runner.txt
          Get-WindowsCapability -Online -Name 'Tools.Graphics.DirectX*' | Format-List | Out-File .cache/gpu-validation/runner.txt -Append
          Get-Item "$env:WINDIR/System32/d3d12SDKLayers.dll" -ErrorAction SilentlyContinue | Select-Object FullName,VersionInfo | Out-File .cache/gpu-validation/runner.txt -Append
      - name: Metal inventory
        if: runner.os == 'macOS'
        run: |
          mkdir -p .cache/gpu-validation
          sw_vers > .cache/gpu-validation/runner.txt
          uname -m >> .cache/gpu-validation/runner.txt
          xcodebuild -version >> .cache/gpu-validation/runner.txt
          system_profiler SPDisplaysDataType >> .cache/gpu-validation/runner.txt
      - name: D5 offscreen capture, comparison and validation
        id: capture
        shell: bash
        env:
          BACKEND: ${{ inputs.backend }}
          REQUIRED: ${{ inputs.required }}
        run: |
          executable=.cache/gpu-bin/somnium_gpu_offscreen
          if [[ "$RUNNER_OS" == Windows ]]; then executable="$executable.exe"; else chmod +x "$executable"; fi
          args=(--executable "$executable" --backend "$BACKEND" --output .cache/gpu-validation)
          if [[ "$REQUIRED" != true ]]; then args+=(--allow-unavailable); fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a vulkaninfo --summary >> .cache/gpu-validation/runner.txt 2>&1
            xvfb-run -a python tools/gpu/run.py "${args[@]}"
          else
            python tools/gpu/run.py "${args[@]}"
          fi
      - name: Probe SDR_LINEAR on the actual presentation surface
        if: steps.capture.outputs.validation == 'validé'
        shell: bash
        env:
          BACKEND: ${{ inputs.backend }}
          MTL_DEBUG_LAYER: '1'
          MTL_SHADER_VALIDATION: '1'
          MTL_SHADER_VALIDATION_REPORT_TO_STDERR: '1'
        run: |
          executable=.cache/gpu-bin/somnium_gpu_capabilities
          if [[ "$RUNNER_OS" == Windows ]]; then executable="$executable.exe"; else chmod +x "$executable"; fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a "$executable" "$BACKEND" .cache/gpu-validation/composition.json > .cache/gpu-validation/composition.log 2>&1
          else
            "$executable" "$BACKEND" .cache/gpu-validation/composition.json > .cache/gpu-validation/composition.log 2>&1
          fi
          cat .cache/gpu-validation/composition.json
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'tools/gpu'); from run import native_validation_error; assert not native_validation_error(Path('.cache/gpu-validation/composition.log').read_text(errors='replace')), 'Composition validation error'"
      - name: Diagnose Metal validation independently (primary failure preserved)
        if: failure() && runner.os == 'macOS' && steps.capture.outcome == 'failure'
        run: python tools/gpu/diagnose_metal.py
      - name: Capture Metal presentation and window lifecycle on the CI desktop
        if: runner.os == 'macOS' && steps.capture.outputs.validation == 'validé'
        run: python tools/presentation/capture_macos.py --executable .cache/gpu-bin/sandbox --output .cache/presentation-metal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'macOS'
        with:
          name: presentation-metal
          path: .cache/presentation-metal/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: d5-${{ inputs.backend }}
          path: .cache/gpu-validation/
          if-no-files-found: error
  result:
    name: D5 ${{ inputs.backend }} — ${{ needs.probe.outputs.validation || 'échec' }}
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Publish render coverage check (neutral when unavailable)
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.probe.outputs.validation }}
          RESULT: ${{ needs.probe.result }}
          BACKEND: ${{ inputs.backend }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          state = os.environ['STATE'] or 'échec'
          success = os.environ['RESULT'] == 'success'
          conclusion = ('success' if state == 'validé' else 'neutral') if success else 'failure'
          repo = os.environ['GITHUB_REPOSITORY']
          payload = dict(name=f"D5 {os.environ['BACKEND']} — {state}", head_sha=os.environ['GITHUB_SHA'], status='completed', conclusion=conclusion,
            details_url=f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            output=dict(title=f"Rendu hors écran : {state}", summary='Image et validation prouvées.' if state == 'validé' else 'Consulter les artefacts D5. Sans device/couche, capture et journal locaux requis avant clôture.'))
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/check-runs', data=json.dumps(payload).encode(),
            headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request) as response:
              print('D5 check:', response.status, conclusion)
          PY
      - name: Publish explicit validation state
        env:
          STATE: ${{ needs.probe.outputs.validation }}
          RESULT: ${{ needs.probe.result }}
          BACKEND: ${{ inputs.backend }}
        run: |
          printf 'D5 %s : **%s**\n' "$BACKEND" "${STATE:-échec}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RESULT" != success ]]; then exit 1; fi
          if [[ "$STATE" == 'non validé' ]]; then
            echo '::notice title=D5 non validé::Capture et journal de validation locaux requis avant clôture de phase.'
          elif [[ "$STATE" != 'validé' ]]; then exit 1; fi
