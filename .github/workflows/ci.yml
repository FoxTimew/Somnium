# Required Windows/Radeon and Linux/lavapipe checks use the same scripts as local runs.
# Fork pull requests must never execute on these persistent runners; presentation windows remain manual.
name: CI self-hosted
on:
  push:
    branches: [main, 'phase/**', 'feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      presentation:
        description: 'Capture D3D12/Vulkan windows with replay (no input injection; leave the desktop free)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Required Windows presets, window test and Radeon D3D12/Vulkan offscreen proofs
        shell: powershell
        run: tools/ci/windows.ps1 pipeline --jobs 2 --window-mode interactive
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Required Linux presets, lavapipe, analysis and sanitizers
        run: bash tools/ci/linux.sh pipeline --jobs 2
  windows-presentation:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event_name == 'workflow_dispatch' && inputs.presentation
    needs: windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Manual D3D12/Vulkan replay presentation captures
        shell: powershell
        run: tools/ci/windows.ps1 captures --backend direct3d12 --window-mode interactive
      - name: Manual Vulkan replay presentation captures
        shell: powershell
        run: tools/ci/windows.ps1 captures --backend vulkan --window-mode interactive
