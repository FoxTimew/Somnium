# Required Windows/Radeon and Linux/lavapipe checks use the same scripts as local runs.
# Fork pull requests must never execute on these persistent runners; captures use engine readback.
name: CI self-hosted
on:
  push:
    branches: [main, 'phase/**', 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Required Windows presets, window test, Radeon proofs and composed frame captures
        shell: powershell
        run: tools/ci/windows.ps1 pipeline --jobs 2 --window-mode interactive
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Required Linux presets, lavapipe, analysis and sanitizers
        run: bash tools/ci/linux.sh pipeline --jobs 2
