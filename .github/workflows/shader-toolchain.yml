# Proves offline shader compilation independently of all engine modules.
# Required providers fail on missing tools; the rejected SDK probe remains manual.
name: Shader toolchain
on:
  workflow_call:
permissions:
  contents: read
jobs:
  compiler:
    name: shadercross (${{ matrix.os }}, ${{ matrix.provider }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, provider: official}
          - {os: ubuntu-24.04, provider: official}
          - {os: macos-15, provider: source}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.3
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Record host toolchain
        id: host
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, platform
          host = {key: os.getenv(key, '') for key in ['ImageOS', 'ImageVersion', 'VCToolsVersion', 'SDKROOT']}
          host['platform'] = platform.platform()
          print(json.dumps(host, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('key=' + hashlib.sha256(json.dumps(host, sort_keys=True).encode()).hexdigest()[:16] + '\n')
          PY
          cmake --version
          ninja --version
      - name: Windows validation layer inventory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/shader-toolchain/reports | Out-Null
          Get-WindowsCapability -Online -Name 'Tools.Graphics.DirectX*' | Format-List | Out-File .cache/shader-toolchain/reports/runner-validation.txt
          Get-Item "$env:WINDIR/System32/d3d12SDKLayers.dll" -ErrorAction SilentlyContinue | Select-Object FullName,VersionInfo | Out-File .cache/shader-toolchain/reports/runner-validation.txt -Append
      - name: macOS Metal inventory
        if: runner.os == 'macOS'
        run: |
          mkdir -p .cache/shader-toolchain/reports
          xcodebuild -version > .cache/shader-toolchain/reports/runner-validation.txt
          system_profiler SPDisplaysDataType >> .cache/shader-toolchain/reports/runner-validation.txt
          find /Applications/Xcode.app -name '*MTLTools*' -o -name '*MetalValidation*' >> .cache/shader-toolchain/reports/runner-validation.txt
      - name: Linux validation layer inventory
        if: runner.os == 'Linux'
        run: |
          mkdir -p .cache/shader-toolchain/reports
          python - <<'PY'
          from pathlib import Path
          import json
          inventory = {str(root): [str(path) for path in root.glob('*.json')] for root in [Path('/usr/share/vulkan/explicit_layer.d'), Path('/usr/share/vulkan/icd.d')]}
          Path('.cache/shader-toolchain/reports/runner-validation.txt').write_text(json.dumps(inventory, indent=2))
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/shader-toolchain/install
          key: shader-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.host.outputs.key }}-${{ hashFiles('tools/shader_toolchain/**') }}
      - name: Build CLI and compile SPIR-V, DXIL, MSL plus reflection
        run: python tools/shader_toolchain/build.py --provider ${{ matrix.provider }} --jobs 3
      - name: Package verified tools for engine jobs
        shell: bash
        run: tar -czf shader-tools.tar.gz -C .cache/shader-toolchain/install .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shader-tools-${{ runner.os }}
          path: shader-tools.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shader-toolchain-${{ runner.os }}-${{ matrix.provider }}
          path: .cache/shader-toolchain/reports/
          if-no-files-found: error
